<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getDatabase, ref, push, onValue, remove, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNW_z_MQ_S7p5vn-fRLcH6hzKmMHmpEtI",
            authDomain: "benim-ilk-sitem.firebaseapp.com",
            databaseURL: "https://benim-ilk-sitem-default-rtdb.firebaseio.com",
            projectId: "benim-ilk-sitem",
            storageBucket: "benim-ilk-sitem.firebasestorage.app",
            messagingSenderId: "766349238368",
            appId: "1:766349238368:web:0df9e38ccac84149cf2305",
            measurementId: "G-BQZZRN9PYP"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        const girisAlani = document.getElementById("girisAlani");
        const sohbetAlani = document.getElementById("sohbetAlani");
        const kullaniciInput = document.getElementById("kullaniciInput");
        const girisBtn = document.getElementById("girisBtn");
        const aktifKullaniciSpan = document.getElementById("aktifKullanici");
        const onlineSayisiSpan = document.getElementById("onlineSayisi");

        const mesajInput = document.getElementById("mesajInput");
        const gonderBtn = document.getElementById("gonderBtn");
        const paylasimlarDiv = document.getElementById("paylasimlar");

        let mevcutKullanici = "";
        let kullaniciRengi = "";

        // 🟢 SAYFA AÇILIR AÇILMAZ ONLINE SAYACINI ÇALIŞTIR
        const userRef = push(ref(db, 'online_kullanicilar'));
        set(userRef, true);
        onDisconnect(userRef).remove(); // Sekmeyi veya tarayıcıyı kapatınca listeden siler

        // ONLINE SAYISINI CANLI DİNLE
        onValue(ref(db, 'online_kullanicilar'), (snapshot) => {
            const onlineData = snapshot.val();
            if (onlineData) {
                onlineSayisiSpan.innerText = Object.keys(onlineData).length;
            } else {
                onlineSayisiSpan.innerText = "0";
            }
        });

        function rastgeleRenkUret() {
            const renkler = ["#e74c3c", "#8e44ad", "#2980b9", "#27ae60", "#d35400", "#c0392b", "#16a085", "#f39c12"];
            return renkler[Math.floor(Math.random() * renkler.length)];
        }

        // İSİM GİRİŞİ
        girisBtn.onclick = function() {
            let isim = kullaniciInput.value.trim();
            if (isim !== "") {
                mevcutKullanici = isim;
                kullaniciRengi = rastgeleRenkUret();
                
                aktifKullaniciSpan.innerText = mevcutKullanici;
                aktifKullaniciSpan.style.color = kullaniciRengi;
                
                girisAlani.style.display = "none";
                sohbetAlani.style.display = "block";
            } else {
                alert("Lütfen bir kullanıcı adı girin!");
            }
        };

        // MESAJ GÖNDERME
        gonderBtn.onclick = function() {
            let yazi = mesajInput.value.trim();

            if (yazi === "butun_paylasimlari_sil") {
                remove(ref(db, 'paylasimlar'));
                mesajInput.value = "";
            } 
            else if (yazi !== "") {
                push(ref(db, 'paylasimlar'), {
                    kullanici: mevcutKullanici,
                    renk: kullaniciRengi,
                    metin: yazi,
                    tarih: Date.now()
                });
                mesajInput.value = "";
            }
        };

        // CANLI MESAJ DİNLEME
        const paylasimlarRef = ref(db, 'paylasimlar');
        onValue(paylasimlarRef, (snapshot) => {
            paylasimlarDiv.innerHTML = "";
            const data = snapshot.val();
            
            if (data) {
                Object.values(data).reverse().forEach(item => {
                    let kart = document.createElement("div");
                    kart.className = "mesaj-kart";
                    let isimRengi = item.renk || '#007bff';
                    kart.innerHTML = `<span class="kullanici-adi" style="color: ${isimRengi}">${item.kullanici || 'Anonim'}:</span> ${item.metin}`;
                    paylasimlarDiv.appendChild(kart);
                });
            }
        });
    </script>
